
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI & Kalori</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
            color: #333;
        }
        .container {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #222;
        }
        label {
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .results {
            margin-top: 20px;
            padding: 10px;
            background: #e9f5ff;
            border-left: 5px solid #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kalkulator BMI & Kalori Harian</h2>
        <label for="weight">Berat Badan (kg):</label>
        <input type="number" id="weight">

        <label for="height">Tinggi Badan (cm):</label>
        <input type="number" id="height">

        <label for="age">Usia:</label>
        <input type="number" id="age">

        <label for="gender">Jenis Kelamin:</label>
        <select id="gender">
            <option value="male">Laki-laki</option>
            <option value="female">Perempuan</option>
        </select>

        <label for="activity">Aktivitas Harian:</label>
        <select id="activity">
            <option value="1.2">Sedentari (jarang gerak)</option>
            <option value="1.375">Ringan (olahraga 1-3x seminggu)</option>
            <option value="1.55">Sedang (olahraga 3-5x seminggu)</option>
            <option value="1.725">Berat (olahraga 6-7x seminggu)</option>
            <option value="1.9">Atlet/pro level</option>
        </select>

        <button onclick="calculate()">Hitung</button>

        <div class="results" id="results"></div>
    </div>

    <script>
        function calculate() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const age = parseFloat(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const activity = parseFloat(document.getElementById('activity').value);

            if (!weight || !height || !age) {
                alert("Mohon isi semua data dengan benar.");
                return;
            }

            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);

            let bmr;
            if (gender === "male") {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            }

            const maintenance = bmr * activity;
            const cutting = maintenance - 500;
            const bulking = maintenance + 300;

            document.getElementById('results').innerHTML = `
                <strong>BMI:</strong> ${bmi.toFixed(1)} (${bmiCategory(bmi)})<br>
                <strong>BMR:</strong> ${bmr.toFixed(0)} kalori/hari<br>
                <strong>Kebutuhan Kalori Harian (Maintenance):</strong> ${maintenance.toFixed(0)} kalori/hari<br>
                <strong>Untuk Cutting (defisit 500):</strong> ${cutting.toFixed(0)} kalori/hari<br>
                <strong>Untuk Bulking (surplus 300):</strong> ${bulking.toFixed(0)} kalori/hari
            `;
        }

        function bmiCategory(bmi) {
            if (bmi < 18.5) return "Kurus";
            else if (bmi < 24.9) return "Normal";
            else if (bmi < 29.9) return "Overweight";
            else return "Obesitas";
        }
    </script>
</body>
</html>
